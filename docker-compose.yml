services:
  # FastAPI Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: wildfire_api
    expose:
      - "8000"
    environment:
      - PORT=8000
      - MODEL_PATH=models/mobilenet_wildfire_model.keras
      - DB_PATH=database/sentinel.db
    volumes:
      # Persist retrained model weights
      - ./models:/app/models
      # Persist the sqlite database directory
      - ./database:/app/database
    networks:
      - wildfire_network
    restart: unless-stopped

# Nginx Load Balancer
  loadbalancer:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - wildfire_network

  # Streamlit UI Dashboard
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: wildfire_ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    volumes:
      # Mount assets folder for static plot rendering
      - ./assets:/app/assets
    depends_on:
      api:
        condition: service_healthy
    networks:
      - wildfire_network
    restart: unless-stopped

networks:
  wildfire_network:
    driver: bridge